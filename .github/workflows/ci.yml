name: Validate application
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: demo-api-key
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: demo-cardap-test.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-cardap-test
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: demo-cardap-test.appspot.com
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "123"
      NEXT_PUBLIC_FIREBASE_APP_ID: demo-app-id
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
  backend-and-printing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm --prefix firebase/employee-access test
      - run: npm --prefix desktop/printing test
  firebase-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: npm install --global firebase-tools@15.34.2
      - run: npm run test:menu:rules
